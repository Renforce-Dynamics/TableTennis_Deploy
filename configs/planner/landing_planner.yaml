planner:
  # model_based uses ball_pos + ball_vel directly and is the first sim2sim target.
  # hope uses a position-history estimator and is better for vision-driven sim2real later.
  type: model_based
  x_hit: 0.3
  dt_integrate: 0.001
  max_predict_time: 2.0
  delta_t_flight: 0.50
  racket_restitution: 0.88
  drag_k: 0.0
  gravity_z: -9.81
  fit_window: 31
  poly_order: 2
  bounce_z_tol: 0.02
  max_table_bounces: 8

table:
  x_min: 0.63
  x_max: 3.37
  y_min: -0.7625
  y_max: 0.7625
  z_surface: 0.76
  net_x: 2.0
  net_height: 0.1525
  net_overhang: 0.15
  ball_radius: 0.02
  # Match Mjlab-Table-Tennis-Unitree-G1-LandingAssistFinetune.
  restitution_h: 0.75
  restitution_v: 0.85

landing_target:
  pos_x: 2.68
  pos_y: 0.0

command:
  # Match mjhitter LandingAssistFinetune: predict early, keep the original
  # TrackMotion command distribution, and blend planner outputs into it.
  activate_before_hit_s: 1.20
  min_time_to_hit_s: 0.03
  max_time_to_hit_s: 2.0
  command_hold_s: 0.04
  advance_hit_time_s: 0.03
  post_hit_x_margin: 0.0
  incoming_vx_threshold: -0.05
  inactive_time_s: 1.20
  inactive_rel_racket_target_pos_w: [0.40, -0.10, 0.25]
  inactive_racket_target_vel_w: [0.0, 0.0, 0.0]

  forehand_y_range: [-0.60, -0.35]
  backhand_y_range: [-0.10, 0.30]
  forehand_pos_offset: [0.01, -0.015, 0.0]
  backhand_pos_offset: [0.01, 0.015, 0.0]
  # LandingAssistFinetune explicitly switches the paddle face by stroke.
  forehand_axis: "-z"
  backhand_axis: "z"
  sign_invariant_rot: false
  forehand_racket_target_pose_range:
    pos_x: [0.4, 0.4]
    pos_y: [-0.6, -0.35]
    pos_z: [0.0, 0.5]
    vel_x: [1.0, 2.0]
    vel_y: [-0.7, 0.7]
    vel_z: [-0.2, 0.7]
  backhand_racket_target_pose_range:
    pos_x: [0.4, 0.4]
    pos_y: [-0.1, 0.3]
    pos_z: [0.0, 0.5]
    vel_x: [1.0, 2.0]
    vel_y: [-0.7, 0.7]
    vel_z: [-0.2, 0.7]
  pos_blend_min: 0.20
  pos_blend_max: 0.85
  vel_blend_min: 0.10
  vel_blend_max: 0.50
  directional_velocity_sampling:
    enabled: true
    pitch_deg_range: [-30.0, 45.0]
    yaw_deg_range: [0.0, 0.0]
    speed_scale_range: [0.85, 1.20]
    min_speed: 0.8
    max_speed: 2.6

  base_target_x: 0.0
  base_target_y_min: -1.2
  base_target_y_max: 1.2
  # Match mjhitter LandingAssistFinetune: if the predicted hit point is
  # outside the legal forehand/backhand band, move the base more decisively.
  base_out_of_range_gain: 2.0
  # The default landing-assist task classifies stroke side in world-Y relative
  # to the base. Set true only if you explicitly want yaw-aligned side logic.
  stroke_side_in_base_frame: false
  base_target_max_delta: 1.2

  racket_speed_min: 0.0
  racket_speed_max: 3.0
  # racket_target_vel_w is a world-frame command. In deployment, keep the
  # blended speed magnitude but use the planner's impact-normal direction so a
  # random lateral command does not make forehand swing left.
  align_racket_velocity_to_normal: false
  # Compress lateral swing command in the robot yaw frame so the final strike
  # stays visually front-facing while base motion absorbs most side offset.
  front_facing_lateral_scale: 0.25
  debug_fixed_front_strike:
    enabled: false
    rel_hit_y: -0.4
    front_speed: 1.5
    front_pitch_deg: 0.0
    rel_hit_x:
    rel_hit_z:

  base_blend_alpha: 1.0
